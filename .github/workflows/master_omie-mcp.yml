# Deploy do MCP server Node/TypeScript (pasta omie/) para o Azure Web App.
# O build acontece AQUI no CI: o artefato publicado já vai com dist/ compilado e
# node_modules de produção — o App Service só executa `node dist/index.js`,
# sem depender do build remoto do Oryx (SCM_DO_BUILD_DURING_DEPLOYMENT=false).

name: Build and deploy Node app to Azure Web App - Omie-MCP

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install, build e podar devDependencies
        working-directory: omie
        run: |
          npm install
          npm run build
          npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          include-hidden-files: true
          path: |
            omie/dist
            omie/node_modules
            omie/package.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'Omie-MCP'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
